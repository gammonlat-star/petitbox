<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order received — petitbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;1,9..144,420&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ede8db;
    --red:#a8672f;
    --gray:#8a887c;
    --line:#242420;
    --umber:#33241a;
    --umber-line:#4a3728;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    background:var(--umber);
    color:var(--white);
    line-height:1.6;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  .display{font-family:'Fraunces', Georgia, serif;}
  nav{
    display:flex; flex-direction:column; align-items:center;
    padding:24px 48px 18px;
    background:#0a0a0a;
  }
  nav .logo{height:34px;}
  .thanks{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:60px 48px;
  }
  .thanks .eyebrow{
    text-transform:uppercase; letter-spacing:3px; font-size:12px;
    color:#e6c9ab; margin-bottom:18px;
  }
  .thanks h1{font-size:34px; font-weight:440; margin-bottom:18px; max-width:520px;}
  .thanks p{color:#d9c9b8; max-width:440px; margin-bottom:36px;}
  .thanks a{
    color:var(--white); text-decoration:none;
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    border-bottom:1px solid var(--umber-line);
    padding-bottom:4px;
  }
  .thanks a:hover{border-color:var(--white);}
</style>
</head>
<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="petitbox">
</nav>

<div class="thanks">
  <div class="eyebrow">Received, from inside the box</div>
  <h1 class="display">Your shirt begins now.</h1>
  <p>Same hand, same box, now sized and addressed to you. Watch your inbox: that's where the details, and the timeline, will find you.</p>
  <a href="index.html">Back to petitbox</a>
</div>

</body>
</html>
